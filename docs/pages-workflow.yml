# Ready-to-activate template. Copy to .github/workflows/pages.yml only after workflow authorization.
name: Deploy formal version to Pages
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tested formal tag vX.Y.Z'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEPLOY_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag
        run: '[[ "$DEPLOY_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          path: tooling
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.DEPLOY_TAG }}
          path: source
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Tagged game acceptance
        working-directory: source
        run: |
          node scripts/check-release.cjs
          node tests/check.cjs
          node tests/world.cjs
          for f in tests/ui.cjs tests/pages.cjs tests/living-world.cjs tests/character.cjs; do
            if [ -f "$f" ]; then node "$f"; fi
          done
      - run: node tooling/scripts/build-pages.cjs --source source --output _site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
